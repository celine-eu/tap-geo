send_anonymous_usage_stats: true
project_id: "tap-geo"
default_environment: test
venv:
  backend: uv
environments:
  - name: test
plugins:
  extractors:
    - name: "tap-geo"
      namespace: "tap_geo"
      pip_url: -e .
      capabilities:
        - state
        - catalog
        - discover
        - about
        - stream-maps

      # Settings schema (so Meltano UI/CLI can guide users)
      settings:
        - name: files
          kind: array
          label: Input files
          description: >
            List of geospatial file configurations. Each entry must be an object with:
            - paths: path to the file (SHP, GeoJSON, OSM, GPKG, GeoParquet)
            - table_name: (optional) custom table name override
            - skip_fields: (optional) array of field names to exclude
            - primary_keys: (optional) array of field names for primary keys
            - geometry_format: (optional) "wkt" (default) or "geojson"
            - bbox: (optional) bounding box filter [west, south, east, north]
          value: []

        - name: files[].paths
          kind: array
          label: File path patterns
          description: >
            List of glob expressions that expand to dataset files
            (supports SHP, GeoJSON, OSM, GPKG, GeoParquet).
            Example: ["data/**/*.shp", "data/*.geojson", "s3://bucket/*.parquet"]

        - name: files[].table_name
          kind: string
          label: Table name
          description: Optional table name override; defaults to the file name without extension.

        - name: files[].skip_fields
          kind: array
          label: Skip fields
          description: List of field names to exclude from records.
          value: []

        - name: files[].primary_keys
          kind: array
          label: Primary keys
          description: Fields to use as primary key(s).
          value: []

        - name: files[].expose_fields
          kind: array
          label: Expose columns
          description: Expose features as column
          value: []

        - name: files[].geometry_format
          kind: string
          label: Geometry format
          description: 'Geometry output format: "wkt" or "geojson".'
          value: wkt
          options:
            - label: Well-Known Text (WKT)
              value: wkt
            - label: GeoJSON object
              value: geojson

        - name: files[].bbox
          kind: array
          label: Bounding box filter
          description: >
            Spatial bounding box as [west, south, east, north].
            For GeoParquet, applied as predicate pushdown before download.
            For other formats, applied as post-parse spatial filter.

      settings_group_validation:
        - ["files", "files[].paths"]

      # TODO: Declare default configuration values here:
      config:
        files:
          - paths:
              - "s3://overturemaps-us-west-2/release/2026-05-20.0/theme=buildings/type=building/*"
            table_name: overture_buildings
            # trentino region bbox
            bbox: [10.5, 45.7, 11.9, 46.4]
            geometry_format: "wkt"

          # - paths:
          #     - s3://local-data/stazioni.shp
          #   # skip_fields: ["unnecessary_field"]
          #   primary_keys: ["nome", "tratta"]
          #   geometry_format: "wkt"
          #   table_name: shp

          # - paths:
          #     - "s3://local-data/test.osm"
          #   # skip_fields: ["unnecessary_field"]
          #   primary_keys: ["id"]
          #   geometry_format: "wkt"
          #   table_name: osm

          # - paths:
          #     - "s3://local-data/test.geojson"
          #   primary_keys: ["id"]
          #   expose_fields: [amenity, name]
          #   geometry_format: "wkt"
          #   table_name: geojson

          # - paths:
          #     - "s3://local-data/test.gpx"
          #   primary_keys: ["link1_href"]
          #   geometry_format: "geojson"
          #   table_name: gpx

  loaders:
    - name: target-jsonl
      variant: andyh1203
      pip_url: target-jsonl
